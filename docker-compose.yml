# go-trader paper instance. `docker compose up -d --build` to run the stable
# paper version; keep developing in the working tree and redeploy when ready.
services:
  go-trader:
    build: .
    image: go-trader:paper
    container_name: go-trader-paper
    ports:
      - "8099:8099"            # dashboard + /status + /health (loopback on host)
    volumes:
      - ./docker-data:/app/data   # persist state.db + logs across restarts
      - ./scheduler/config.docker.json:/app/scheduler/config.json:ro   # edit config w/o rebuild
      - ./backtest:/app/backtest:ro   # registry_loader + simulate deps (tuner/simulate probes)
      - ./research:/app/research      # latest engine + orchestrator + position-state (rw)
    env_file:
      - .env          # HYPERLIQUID_TESTNET + ACCOUNT_ADDRESS + SECRET_KEY (testnet)
    environment:
      - GO_TRADER_ALLOW_MISSING_STATE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8099/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
